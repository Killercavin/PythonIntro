spring:
  application:
    name: usage-service

  kafka:
    bootstrap-servers: http://localhost:9094
    consumer:
      group-id: wattwise-usage-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            type:
              mapping:EnergyUsageEvent:io.github.devcavin.wattwise.kafka.event.EnergyUsageEvent

    template:
      default-topic: wattwise-energy-alert
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

usage-app:
  user-url: http://localhost:8080/api/v1/users
  influx-url: http://localhost:8086
  influx-token: 25adWeaLpJBPBtcpyWUiLh4NyEzXbI7OeHg6qBqW9sc=
  influx-organization: wattwise
  influx-bucket: usage-bucket